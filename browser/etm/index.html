<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
  <title>Bridging Examples Explorer</title>
  <style>:root {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #252a31;
  background: #fff;
  font-size: 13px;
  --line: #e0e4e8;
  --muted: #69717e;
  --code-size: 12px;
  --bar-height: 42px;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  letter-spacing: 0;
}
* { box-sizing: border-box; }
body { margin: 0; }
button, input, select { font: inherit; }
button, select { cursor: pointer; }
button { color: inherit; border: 1px solid var(--line); border-radius: 4px; background: #fff; padding: 5px 9px; }
button:hover { background: #f0f3f6; }
button:disabled { cursor: default; opacity: .45; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid #16786c; outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.topbar { height: var(--bar-height); display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid var(--line); background: #fbfcfd; }
h1 { font-size: 14px; font-weight: 650; line-height: 1; margin: 0 3px 0 0; }
h1 a { color: inherit; text-decoration: none; }
.at-home .item-picker, .at-home #focus-declaration, .at-home .view-menu, .at-home .coverage, .at-home #provenance { display: none; }
.home { flex: 1; min-height: 0; overflow: auto; }
.home-inner { max-width: 1040px; margin: 0 auto; padding: 44px 20px 60px; }
.overview { display: block; width: 100%; max-width: 788px; min-width: 560px; height: auto; margin: 0 auto 44px; }
.overview .stage rect { fill: #fff; stroke: #d5dce3; }
.overview .stage .dot { stroke: none; fill: #5886b2; }
.overview .stage.aeneas .dot { fill: #188a79; }
.overview .stage.spec .dot { fill: #5a6fb0; }
.overview .stage.crypto .dot { fill: #b38035; }
.overview .stage.bridge .dot { fill: #a6535d; }
.overview .name { font-size: 13px; font-weight: 650; }
.overview .shape { font: 11.5px var(--mono); fill: var(--muted); }
.overview .link { fill: none; stroke: #9aa5b1; stroke-width: 1.2; }
.overview marker path { fill: #9aa5b1; }
.example-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.example-tile { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: inherit; text-decoration: none; }
.example-tile:hover { border-color: #77ae9e; background: #f6fbf9; }
.example-tile strong { font-size: 13px; font-weight: 650; }
.example-tile span { font-size: 11.5px; line-height: 1.5; color: var(--muted); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.bar-spacer { flex: 1; }
.icon-button { width: 27px; height: 27px; flex-shrink: 0; padding: 0; font-size: 18px; line-height: 1; }
.icon-button svg { width: 16px; height: 16px; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-button[aria-pressed="true"] { background: #e9f4f1; border-color: #77ae9e; color: #12685e; }
.item-picker { min-width: 0; flex-shrink: 0; }
.example-picker { min-width: 0; flex-shrink: 0; }
.example-picker select { width: 156px; min-height: 27px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px; background: #fff; font-size: 11px; }
.item-picker select { width: 180px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px; background: #fff; font: 11px var(--mono); min-height: 27px; }
.view-menu { position: relative; flex-shrink: 0; font-size: 11px; }
.view-menu summary { padding: 5px 7px; list-style: none; cursor: pointer; border-radius: 4px; }
.view-menu summary::-webkit-details-marker { display: none; }
.view-menu summary::after { content: "\25BE"; margin-left: 5px; color: var(--muted); }
.view-menu[open] summary, .view-menu summary:hover { background: #e9eef2; }
.view-options { position: absolute; z-index: 20; right: 0; top: calc(100% + 7px); width: 220px; padding: 8px 12px; border: 1px solid #d5dce3; border-radius: 4px; background: #fff; box-shadow: 0 5px 16px #233b4b1a; }
.view-options > label { display: flex; align-items: center; gap: 7px; padding: 9px 0; color: #586574; cursor: pointer; }
.font-size { justify-content: space-between; }
.font-size input { width: 48px; padding: 4px 2px 4px 5px; border: 1px solid var(--line); border-radius: 3px; }
#provenance { font-size: 11px; min-height: 27px; padding: 4px 8px; flex-shrink: 0; }
.coverage { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 10px; color: var(--muted); white-space: nowrap; }
input[type="checkbox"] { accent-color: #16796f; margin: 0; }
.workspace { display: grid; grid-template-columns: minmax(0, 1fr); height: calc(100dvh - var(--bar-height)); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #128274; }
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.panes { flex: 1; display: grid; grid-template-columns: var(--pane-columns); min-width: 0; min-height: 0; }
.pane { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
.pane:last-child { border-right: 0; }
.pane-resizer { position: absolute; z-index: 3; top: 0; bottom: 0; right: -6px; width: 11px; cursor: col-resize; touch-action: none; outline: none; }
.pane-resizer.leading { right: auto; left: -6px; }
.pane-resizer::after { content: ""; position: absolute; top: 0; bottom: 0; left: 5px; width: 2px; background: transparent; }
.pane-resizer:hover, .pane-resizer:focus-visible, .pane-resizer.dragging { background: #16786c18; }
.pane-resizer:hover::after, .pane-resizer:focus-visible::after, .pane-resizer.dragging::after { background: #16786c; }
.resizing-panes, .resizing-panes * { cursor: col-resize !important; user-select: none !important; -webkit-user-select: none !important; }
.pane-header { min-height: 54px; flex-shrink: 0; padding: 7px 12px 6px; border-bottom: 1px solid var(--line); }
.pane-title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
.pane-header h3 { display: flex; gap: 7px; align-items: center; font-size: 12px; margin: 0; font-weight: 650; }
.pane-header h3::before { content: ""; display: block; width: 7px; height: 7px; flex-shrink: 0; border-radius: 2px; background: #5886b2; }
.pane.aeneas .pane-header h3::before { background: #188a79; }
.pane.spec .pane-header h3::before { background: #5a6fb0; }
.pane.crypto .pane-header h3::before { background: #b38035; }
.pane.bridge .pane-header h3::before { background: #a6535d; }
.stage-status { padding: 8px 12px; font-size: 11px; color: #8b5c1c; border-bottom: 1px solid var(--line); }
.source-picker { width: 100%; min-width: 0; border: 0; background: transparent; font: 10px/1.5 var(--mono); color: var(--muted); }
.pane-actions { display: flex; flex-wrap: wrap; max-width: 100%; align-items: center; gap: 5px; }
.pane-actions button { font-size: 10px; padding: 3px 6px; }
.pane-toggle, .pane-actions .pane-toggle { width: 24px; height: 24px; flex-shrink: 0; padding: 3px; display: inline-flex; align-items: center; justify-content: center; }
.pane-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pane.minimized { background: #f7f9fa; }
.pane.minimized .pane-header { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 0; }
.pane.minimized h3 { writing-mode: vertical-rl; font-size: 11px; }
.file-path { display: block; font: 10px/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.file-picker { display: block; min-width: 0; }
.file-picker select { width: 100%; min-width: 0; font: 10px/1.5 var(--mono); color: var(--muted); border: 0; background: transparent; }
.section-file { padding: 0 14px 8px; }
.pane-body { overflow: auto; min-height: 0; flex: 1; padding: 10px 0 35px; overscroll-behavior: contain; background: #fff; }
.related-context { position: sticky; top: -10px; z-index: 1; padding: 6px 12px; margin-top: -10px; margin-bottom: 10px; border-bottom: 1px solid var(--line); background: #fbfcfd; display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--muted); }
.related-context label { min-width: 0; flex: 1; }
.related-context select { width: 100%; min-width: 0; border: 1px solid #d9dee5; border-radius: 3px; background: #fff; padding: 4px 6px; font: 10px var(--mono); color: #596574; }
.related-context button { margin-left: auto; padding: 3px 5px; font-size: 10px; flex-shrink: 0; }
.security-context { flex-wrap: wrap; }
.security-context label { flex: 1 1 145px; }
.pane.rust .pane-body { background: #fcfdff; }
.pane.aeneas .pane-body { background: #fcfefd; }
.code { font: var(--code-size)/1.8 var(--mono); margin: 0; tab-size: 2; }
.evidence-label { display: block; margin: 8px 14px 2px 42px; font: 600 10px/1.5 var(--sans, sans-serif); white-space: normal; }
.evidence-label.assumption { color: #895a18; }
.proof-body { margin: 2px 0 6px; }
.proof-body > summary { padding: 3px 14px 3px 42px; color: #5d6974; cursor: pointer; font: 500 11px/1.5 var(--sans, sans-serif); }
.proof-body > summary:hover { background: #f4f6f8; }
.proof-body[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 3px; }
.line { display: flex; min-height: calc(var(--code-size) * 1.8); padding-right: 14px; border-left: 2px solid transparent; }
.line .ln { flex: 0 0 40px; text-align: right; padding-right: 10px; color: #9aa2ad; user-select: none; font-size: 10px; padding-top: 1px; text-decoration: none; }
.line button.ln { border: 0; border-radius: 0; background: transparent; align-self: flex-start; line-height: inherit; }
.line button.ln:hover { color: #252a31; text-decoration: underline; }
.line code { font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; flex: 1; }
.line[data-atom] { cursor: pointer; }
.line[data-atom]:hover { background: #f0f4f7; }
.line.focused { background: #eaf4f1; border-left-color: #77ae9e; }
.line.active-addition:not(.hypothesis) { background: #deeee8; border-left-color: #368d74; }
.line.hypothesis { background: #fff3d9; border-left-color: #bc8b37; }
.token-keyword { color: #77519c; }
.token-comment { color: #72847e; }
.token-string { color: #377947; }
.token-number { color: #9a5a2b; }
.token-type { color: #256e93; }
.addition-section { padding-top: 8px; padding-bottom: 15px; border-bottom: 1px solid #e9ecef; margin-bottom: 13px; }
.addition-section:last-child { border-bottom: 0; }
.addition-title { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 0 14px 9px; }
.addition-title a { font: 10px/1.5 var(--mono); color: #596574; text-decoration: none; overflow-wrap: anywhere; }
.addition-title a:hover { text-decoration: underline; }
.addition-kind { flex: 0 1 auto; max-width: 45%; overflow-wrap: anywhere; font-size: 9px; color: #6f7e88; text-align: right; }
.addition-kind.assumption { color: #91611c; }
.empty-additions { padding: 22px 20px; color: #69717e; line-height: 1.7; font-size: 12px; }
.empty-additions strong { color: #404d5a; display: block; font-size: 12px; font-weight: 550; margin-bottom: 7px; }
.empty-additions button { display: block; margin-top: 16px; font-size: 11px; }
.support-label { margin: 25px 14px 17px; border-top: 1px solid var(--line); padding-top: 15px; color: #657482; font-weight: 600; font-size: 11px; }
dialog { border: 1px solid #d5dce3; border-radius: 6px; padding: 24px; max-width: 780px; width: calc(100% - 36px); max-height: calc(100dvh - 50px); }
dialog::backdrop { background: #172d3e55; }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 22px; }
.dialog-head h2 { font: 600 18px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.provenance-note { line-height: 1.7; color: var(--muted); font-size: 12px; }
.provenance-table { border-collapse: collapse; width: 100%; font-size: 11px; }
.provenance-table th, .provenance-table td { text-align: left; border-top: 1px solid var(--line); padding: 12px 0; vertical-align: top; }
.provenance-table th { font-weight: 500; padding-right: 20px; }
.hash { display: block; font: 10px/1.8 var(--mono); color: var(--muted); overflow-wrap: anywhere; margin-top: 6px; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); border-radius: 4px; padding: 9px 16px; background: #263d39; color: #fff; box-shadow: 0 3px 12px #0002; font-size: 12px; z-index: 10; }
@media (max-width: 1050px) {
  .topbar h1 { display: none; }
  .topbar { gap: 8px; }
  .coverage { display: none; }
  .pane-header { padding-left: 10px; padding-right: 10px; }
  .pane-title { flex-wrap: wrap; }
}
@media (max-width: 760px) {
  :root { --bar-height: 76px; }
  .topbar { padding: 5px 8px; gap: 4px 7px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
  .topbar h1 { display: none; }
  .example-picker { grid-column: 1; }
  .item-picker { grid-column: 2 / 4; }
  .example-picker select, .item-picker select { width: 100%; min-width: 0; }
  #focus-declaration { grid-column: 1; }
  .view-menu { grid-column: 2; justify-self: end; }
  #provenance { grid-column: 3; }
  .bar-spacer { display: none; }
  .workspace { display: block; height: auto; }
  main { min-height: calc(100dvh - var(--bar-height)); }
  .panes { display: block; overflow: visible; }
  .pane-resizer { display: none; }
  .panes .pane { min-height: 150px; max-height: 70dvh; border-right: 0; border-bottom: 1px solid var(--line); }
  .panes .pane.minimized { min-height: 0; max-height: none; }
  .pane.minimized .pane-header { flex-direction: row; min-height: 38px; padding: 7px 12px; gap: 9px; }
  .pane.minimized h3 { writing-mode: horizontal-tb; }
  .pane-header { padding: 7px 12px 6px; min-height: 54px; }
  .pane-title { flex-wrap: nowrap; }
  .pane-body { max-height: 58dvh; min-height: 60px; }
}
@media print {
  .topbar, .home, .pane-actions, .related-context, .pane.minimized, .pane-resizer { display: none; }
  .workspace { display: block; height: auto; }
  .panes { display: block; }
  .pane, .panes .pane { max-height: none; break-inside: avoid; }
  .pane-body { overflow: visible; max-height: none; }
}


.hl.lean {
  white-space: pre;
  font-weight: normal;
  font-style: normal;
  font-size: inherit;
}

.hl.lean .keyword {
  color: var(--verso-code-keyword-color,);
  font-weight: var(--verso-code-keyword-weight, bold);
  font-style: var(--verso-code-keyword-style, normal);
  font-family: var(--verso-code-keyword-font-family,);
}

.hl.lean .const {
  color: var(--verso-code-const-color,);
  font-weight: var(--verso-code-const-weight, normal);
  font-style: var(--verso-code-const-style, normal);
  font-family: var(--verso-code-const-font-family,);
}

.hl.lean .var {
  color: var(--verso-code-var-color,);
  font-weight: var(--verso-code-var-weight, normal);
  font-style: var(--verso-code-var-style, italic);
  font-family: var(--verso-code-var-font-family,);

  position: relative;
}

.hl.lean .literal, .hl.lean .unknown {
  color: var(--verso-code-color,);
  font-weight: normal;
  font-style: normal;
  font-family: var(--verso-code-font-family,);
}

/* These lexically-classified token kinds default to the `.unknown` appearance. The rule follows
   `.const` so it wins for the `anon-ctor` tokens, which also carry the `const` class. */
.hl.lean .anon-ctor,
.hl.lean .number,
.hl.lean .char,
.hl.lean .comment,
.hl.lean .punctuation,
.hl.lean .delim,
.hl.lean .wildcard {
  color: var(--verso-code-color,);
  font-weight: normal;
  font-style: normal;
  font-family: var(--verso-code-font-family,);
}

.hover-container {
  width: 0;
  height: 0;
  position: relative;
  display: inline;
}

.hl.lean a {
  color: inherit;
  text-decoration: currentcolor underline dotted;
}

.hl.lean a:hover {
  text-decoration: currentcolor underline solid;
}

/* Links inside tooltips show their underline only when hovered. */
.tippy-box .hl.lean a {
  text-decoration: none;
}

.hl.lean .hover-info {
  white-space: normal;
}

.hl.lean .token .hover-info {
  display: none;
  position: absolute;
  color: var(--verso-tooltip-color, black);
  background-color: var(--verso-tooltip-bg-color, #e5e5e5);
  border: 1px solid var(--verso-tooltip-border-color, black);
  padding: 0.5rem;
  z-index: 300;
}

.hl.lean .hover-info.messages {
  max-height: 10rem;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-gutter: stable;
  padding: 0 0.5rem 0 0;
  display: block;
}

.hl.lean .hover-info code {
  white-space: pre-wrap;
  background: none;
}

.hl.lean .hover-info code:not(.verso-message) {
  color: var(--verso-tooltip-color, black);
}

.hl.lean .hover-info.messages > code {
  padding: 0.5rem;
  display: block;
  width: fit-content;
}

.hl.lean .hover-info.messages > code:only-child {
  margin: 0;
}

.hl.lean .hover-info.messages > code {
  margin: 0.1rem;
}

.hl.lean .hover-info.messages > code:not(:first-child) {
  margin-top: 0rem;
}

.hl.lean {
}

.hl.lean.block {
  display: block;
}

.hl.lean.inline {
  display: inline;
  white-space: pre-wrap;
}

.hl.lean * {
}

.hl.lean .token {
  transition: all 0.25s; /* Slight fade for highlights */
}

@media (hover: hover) {
  /* Hovered content nested in a collapsed tactic region keeps its plain background: the
     region's proof state is the tooltip that appears there, and its label is what
     highlights. `:where` keeps the exclusion out of the specificity computation. */
  .hl.lean .token.binding-hl,
  .hl.lean :is(.literal, .token.typed, .token[data-verso-hover]):hover:not(:where(.tactic:has(> .tactic-toggle:not(:checked)) > label *)) {
    background-color: var(--verso-code-hover-bg-color, #eeeeee);
    border-radius: 2px;
    transition: none;
  }

  /* Within a hovered message span, token hover backgrounds are removed so the span's own
     hover background shows across the whole span. The exception is a hovered documented
     token, which keeps its background because its tooltip is the one shown. */
  .hl.lean .has-info:hover .token.binding-hl:not(:hover),
  .hl.lean .has-info:hover .token.binding-hl:not([data-verso-hover]),
  .hl.lean .has-info:hover .literal:hover:not([data-verso-hover]),
  .hl.lean .has-info:hover .token.typed:hover:not([data-verso-hover]) {
    background-color: transparent;
  }
}


.hl.lean .has-info .token:not(.tactic-state):not(.tactic-state *), .hl.lean .has-info .inter-text:not(.tactic-state):not(.tactic-state *) {
  text-decoration-style: wavy;
  text-decoration-line: underline;
  text-decoration-thickness: from-font;
  text-decoration-skip-ink: none;
}

/*
The underline color comes from the nearest enclosing message span: each severity's span rule
sets `--verso--region-indicator-color`, which inherits, so a region nested inside one of
another severity keeps its own indicator color.
*/
.hl.lean .has-info :not(.tactic-state):not(.tactic-state *) {
  text-decoration-color: var(--verso--region-indicator-color);
}

.hl.lean .has-info .hover-info {
  display: none;
  position: absolute;
  transform: translate(0.25rem, 0.3rem);
  color: var(--verso-tooltip-color, black);
  border: 1px solid var(--verso-tooltip-border-color, black);
  padding: 0.5rem;
  z-index: 400;
  text-align: left;
}

.hl.lean .has-info.error {
  --verso--region-indicator-color: var(--verso-error-indicator-color, #ff0000);
  --verso--region-hover-color: var(--verso-code-error-hover-color, currentcolor);
  --verso--region-hover-bg-color: var(--verso-code-error-hover-bg-color, #ffb3b3);
  color: var(--verso-code-error-color, currentcolor);
  background-color: var(--verso-code-error-bg-color, transparent);
}

/*
The hover highlight follows the tooltip: a message span highlights only when its own tooltip
is the one that appears. When a hovered nested message span, a hovered documented token, or
a hovered collapsed tactic label shows its own tooltip instead, the message span does not
highlight. A span nested in a collapsed tactic region likewise stays plain, because hovering
it shows the region's proof state; `:where` keeps that exclusion out of the specificity
computation.

The hover colors come from `--verso--region-hover-color` and `--verso--region-hover-bg-color`,
which each severity's span rule sets. This keeps the hover conditions in this one rule, and
because the properties inherit, a region nested inside one of another severity keeps its own
hover colors.
*/
@media (hover: hover) {
  .hl.lean .has-info:hover:not(:has(.has-info:hover)):not(:has([data-verso-hover]:hover)):not(:has(.tactic > label:hover + .tactic-toggle:not(:checked))):not(:where(.tactic:has(> .tactic-toggle:not(:checked)) > label *)) {
    color: var(--verso--region-hover-color, currentcolor);
    background-color: var(--verso--region-hover-bg-color, transparent);
  }
}

.hl.lean .hover-info.messages > code.error {

/*
A tooltip that shows only messages of the box's own severity leaves severity styling to the

severity accent to distinguish them.

@media (hover: hover) {

     tooltip for everything else in its label, so the label keeps its highlight while any of that
     content is hovered. */
  .hl.lean .tactic:has(> .tactic-toggle:not(:checked)) > label:hover:not(:has(.tactic > label:hover)) {

.hl.lean .tactic > label::after {

  height: 0.25em;
  vertical-align: middle;

/*
@media (hover: hover) {

}

.hl.lean .tactic > label:has(+ .tactic-toggle:checked)::after {

    const verso = file.html && line === (file.rows ||= file.text.split('\n'))[n-1] ? file.html[n-1] : null;
    const text = verso ?? (blockComment ? `<span class="token-comment">${esc(line)}</span>` : highlight(line));
    if (line.includes('-/') || line.includes('*/')) blockComment = false;
    const focused = selected.some(r => n >= r.start && n <= (r.end || Infinity));
    const declaration = (i > 0 || part.column === 0 || firstLine !== part.line) && declarations.find(d => d.start === n);
    const evidence = declaration && Explorer.evidence(declaration);
    const trustTitle = declaration && declaration.status + ': ' + declaration.type;
    const badge = evidence ? `<span class="evidence-label ${evidence.kind}" title="${esc(declaration.status)}">${evidence.label}</span>` : '';
    const atom = Explorer.atomAt(data, stage, file.path, n);
    const number = atom ? `<button class="ln" data-atom="${esc(atom.id)}" title="Select ${esc(atom.name)}">${n}</button>` : `<span class="ln">${n}</span>`;
    return `${badge}<span class="line${focused ? ' focused':''}" data-line="${n}"${atom ? ` data-atom="${esc(atom.id)}"`:''}${declaration ? ` title="${esc(trustTitle)}"`:''}>${number}<code>${text || ' '}</code></span>`;
  }).join('')}</pre>`;
}
function code(file, stage, start, end) {
  return Explorer.proofParts(file,data.declarations,{start,end}).map(part=>{
    const content = codePart(file,stage,part);
    if (!part.declaration) return content;
    const key = `${data.id}:${part.declaration.name}`;
    return `<details class="proof-body" data-proof="${esc(key)}"${openProofs.has(key)?' open':''}><summary aria-label="Proof of ${esc(part.declaration.name)}">Proof</summary>${content}</details>`;
  }).join('');
}
function body(stage) {
  const file = data.files[files[stage]];
  const related = ranges(stage);
  const status = item && ['spec','crypto','bridge'].includes(stage) && !related.length ? `<div class="stage-status">${Explorer.pending(data,item,stage)}</div>` : '';
  if (!file) return `<div class="empty-additions"><strong>${Explorer.pending(data,item,stage)}</strong></div>`;
  const declarations = data.declarations.filter(d => d.file === file.path);
  const picker = declarations.length ? `<div class="related-context"><select data-declaration="${stage}" aria-label="${titles[stage]} declaration"><option value="">Declarations (${declarations.length})</option>${declarations.map(d => `<option value="${esc(d.name)}">${related.some(r=>r.name===d.name)?'* ':''}${esc(d.name)} (${esc(d.status)})</option>`).join('')}</select></div>` : '';
  const selected = state.mode === 'files' ? null : related.filter(r=>r.file===file.path);
  return status + picker + Explorer.sourceBlocks(data,file,selected).map(r=>code(file,stage,r.start,r.end)).join('');
}
// Overview: Rust is extracted to Aeneas, Spec states what the extracted function returns, and
// Bridge relates the extracted function to Crypto, using Spec.
function overview() {
  const stage=(key,x,y,caption)=>`<g class="stage ${key}"><rect x="${x}" y="${y}" width="152" height="64" rx="6"/><rect class="dot" x="${x+14}" y="${y+17}" width="8" height="8" rx="2"/><text class="name" x="${x+30}" y="${y+25}">${titles[key]}</text><text class="shape" x="${x+14}" y="${y+48}">${caption}</text></g>`;
  const arrow=x=>`<path class="link" d="M${x+4} 44H${x+52}" marker-end="url(#overview-arrow)"/>`;
  const diagram=`<svg class="overview" viewBox="0 0 788 200" role="img" aria-label="Rust is extracted to Aeneas. Spec states what the extracted function returns. Bridge shows the extracted function equal in distribution to the Crypto algorithm, given assumptions, and uses Spec.">
    <defs><marker id="overview-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z"/></marker></defs>
    ${stage('rust',0,12,'fn f')}${stage('aeneas',212,12,'def f : Result')}${stage('spec',424,12,'theorem f_spec')}${stage('crypto',636,12,'def f : ProbComp')}${stage('bridge',424,124,'theorem f_bridge')}
    ${arrow(152)}${arrow(364)}
    <path class="link" d="M288 80V156H420" marker-start="url(#overview-arrow)"/><path class="link" d="M712 80V156H580" marker-start="url(#overview-arrow)"/>
    <path class="link" d="M500 80V120" marker-end="url(#overview-arrow)"/>
  </svg>`;
  const tiles=bundle.examples.map(e=>`<a class="example-tile" href="#example=${esc(e.id)}"><strong>${esc(e.name)}</strong><span>${esc(e.description||'')}</span></a>`).join('');
  return `<div class="home-inner">${diagram}<div class="example-tiles">${tiles}</div></div>`;
}
function layout() { return Panels.layout(state,widths.get(Panels.signature(state)),$('#panes').clientWidth); }
function resize() {
  if (mobile.matches || home) return;
  const l = layout();
  $('#panes').style.setProperty('--pane-columns',Object.values(l.sizes).map(n=>`${n}px`).join(' '));
  document.querySelectorAll('[data-resize]').forEach(el=>{
    const next=l.active[l.active.indexOf(el.dataset.resize)+1];
    el.setAttribute('aria-valuenow',Math.round(100*l.sizes[el.dataset.resize]/(l.sizes[el.dataset.resize]+l.sizes[next])));
  });
}
function endDrag(commit) {
  if (!drag) return;
  const old = drag; drag = null;
  if (!commit) widths.set(old.signature,old.weights);
  old.el.classList.remove('dragging'); document.body.classList.remove('resizing-panes');
  if (old.el.hasPointerCapture(old.pointer)) old.el.releasePointerCapture(old.pointer);
  old.el.blur(); resize(); save();
}
function resetWidths() { endDrag(false); widths.delete(Panels.signature(state)); resize(); save(); }
function wireResize() {
  for (const el of document.querySelectorAll('[data-resize]')) {
    el.onpointerdown=e=>{
      if(e.button!==0 || !e.isPrimary || mobile.matches) return;
      e.preventDefault();
      const signature=Panels.signature(state);
      drag={el,pointer:e.pointerId,x:e.clientX,layout:layout(),signature,weights:widths.get(signature)};
      el.setPointerCapture(e.pointerId); el.classList.add('dragging'); document.body.classList.add('resizing-panes');
    };
    el.onpointermove=e=>{if(drag?.pointer!==e.pointerId)return; widths.set(drag.signature,Panels.resize(drag.layout,el.dataset.resize,e.clientX-drag.x));resize();};
    el.onpointerup=e=>{if(drag?.pointer===e.pointerId)endDrag(true);};
    el.onpointercancel=el.onlostpointercapture=e=>{if(drag?.pointer===e.pointerId)endDrag(false);};
    el.ondblclick=resetWidths;
    el.onkeydown=e=>{
      if(['Home','Enter'].includes(e.key)){e.preventDefault();resetWidths();}
      else if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();widths.set(Panels.signature(state),Panels.resize(layout(),el.dataset.resize,(e.key==='ArrowLeft'?-1:1)*(e.shiftKey?48:16)));resize();save();}
      else if(e.key==='Escape')endDrag(false);
    };
  }
}
function render(preserveScroll = false) {
  const scroll = new Map(Explorer.stages.map(stage => [stage, $('#pane-body-'+stage)?.scrollTop]));
  endDrag(true);
  document.title=`${data.name} - Bridging Examples`;
  $('#home').hidden=!home; $('#panes').hidden=home; document.body.classList.toggle('at-home',home);
  $('#example-picker').value=home?'':data.id;
  if(home){document.title='Bridging Examples';return;}
  $('#item-picker').innerHTML=`<option value="">Declarations (${data.items.length})</option>`+data.items.map(i=>`<option value="${esc(i.id)}">${esc(i.name)}</option>`).join('');
  $('#item-picker').value=item?.id ?? '';
  $('#item-title').textContent=item?.name ?? data.name;
  $('#focus-declaration').disabled=!item;
  $('#item-summary').textContent=data.name;
  $('#check-status').textContent=data.coverage?`Spec ${data.coverage.spec}/${data.coverage.atoms} · Crypto ${data.coverage.crypto}/${data.coverage.atoms} · Bridge ${data.coverage.bridge}/${data.coverage.atoms}`:'Not extracted';
  $('#focus-declaration').setAttribute('aria-pressed',state.mode==='declaration');
  $('#focus-declaration').title=state.mode==='files'?'Focus selected declaration':'Show full files';
  $('#focus-declaration').setAttribute('aria-label',$('#focus-declaration').title);
  $('#font-size').value=state.font; document.documentElement.style.setProperty('--code-size',`${state.font}px`);
  $('#show-support').checked=state.support;
  const active=Panels.active(state);
  $('#panes').innerHTML=Explorer.stages.map(stage=>{
    const expanded=state[stage],disabled=expanded&&active.length===1;
    const label=`${expanded?'Minimize':'Restore'} ${titles[stage]}`;
    const toggle=`<button class="pane-toggle" data-toggle="${stage}" title="${label}" aria-label="${label}" aria-expanded="${expanded}"${disabled?' disabled':''}>${icon(expanded?'minus':'plus')}</button>`;
    if(!expanded)return `<section class="pane ${stage} minimized"><div class="pane-header">${toggle}<h3>${titles[stage]}</h3></div></section>`;
    const options=Explorer.files(data,stage,state.support),file=data.files[files[stage]];
    const next=active[active.indexOf(stage)+1],previous=active[active.indexOf(stage)-1];
    const railsBefore=previous&&Explorer.stages[Explorer.stages.indexOf(stage)-1]!==previous;
    const handle=(left,right,side)=>`<div class="pane-resizer${side}" data-resize="${left}" role="separator" tabindex="0" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-label="Resize ${titles[left]} and ${titles[right]}" title="Drag to resize; double-click to reset"></div>`;
    return `<section class="pane ${stage}"><div class="pane-header"><div class="pane-title"><h3>${titles[stage]}</h3><div class="pane-actions"><button class="pane-toggle" data-copy="${stage}" title="Copy displayed source" aria-label="Copy ${titles[stage]} source"${!file?' disabled':''}>${icon('copy')}</button><button class="pane-toggle" data-download="${stage}" title="Download complete file" aria-label="Download ${titles[stage]} file"${!file?' disabled':''}>${icon('download')}</button>${toggle}</div></div><select class="source-picker" data-source="${stage}" aria-label="${titles[stage]} source file"${!options.length?' disabled':''}>${options.map(p=>`<option value="${esc(p)}"${files[stage]===p?' selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="pane-body" id="pane-body-${stage}">${body(stage)}</div>${railsBefore?handle(previous,stage,' leading'):''}${next?handle(stage,next,''):''}</section>`;
  }).join('');
  for(const stage of Explorer.stages){$('#show-'+stage).checked=state[stage];$('#show-'+stage).disabled=state[stage]&&active.length===1;}
  document.querySelectorAll('.line[data-atom]').forEach(el=>el.onclick=event=>{
    if (!Explorer.shouldSelectCode(event,window.getSelection()?.toString()) || el.dataset.atom === item?.id) return;
    const panel = el.closest('.pane-body');
    const stage = panel.id.slice('pane-body-'.length);
    select(el.dataset.atom,{stage,file:files[stage],top:panel.scrollTop,left:panel.scrollLeft});
  });
  document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{Panels.set(state,el.dataset.toggle,!state[el.dataset.toggle]);save();render(true);});
  document.querySelectorAll('[data-proof]').forEach(el=>el.ontoggle=()=>{
    if(el.open)openProofs.add(el.dataset.proof);else openProofs.delete(el.dataset.proof);
  });
  document.querySelectorAll('[data-source]').forEach(el=>el.onchange=()=>{files[el.dataset.source]=el.value;save();render();});
  document.querySelectorAll('[data-copy]').forEach(el=>el.onclick=async()=>{
    const text=visibleText(el.dataset.copy);
    try{await navigator.clipboard.writeText(text);}catch{const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();document.execCommand('copy');area.remove();}
  });
  document.querySelectorAll('[data-download]').forEach(el=>el.onclick=()=>{
    const file=data.files[files[el.dataset.download]],a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([file.text],{type:'text/plain'}));a.download=file.path.split('/').at(-1);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
  document.querySelectorAll('[data-declaration]').forEach(el=>el.onchange=()=>{
    const d=data.declarations.find(d=>d.name===el.value); if(!d)return;
    const panel=$('#pane-body-'+el.dataset.declaration);
    panel.querySelector(`[data-line="${d.start}"]`)?.scrollIntoView({block:'center'});
    panel.querySelectorAll('.line').forEach(line=>line.classList.toggle('active-addition',+line.dataset.line>=d.start&&+line.dataset.line<=d.end));
  });
  wireResize();resize();bindVerso();
  if(state.mode==='files')for(const stage of active){const first=ranges(stage).find(r=>r.file===files[stage]);const panel=$('#pane-body-'+stage);const line=first&&panel?.querySelector(`[data-line="${first.start}"]`);const target=line;if(preserveScroll&&scroll.get(stage)!=null)panel.scrollTop=scroll.get(stage);else if(target)panel.scrollTop=Math.max(0,target.offsetTop-panel.offsetTop-45);}
}
function provenance() {
  const source = f => data.repository && data.revision && !data.dirty
    ? `<a href="${esc(data.repository+'/blob/'+data.revision+'/'+f.path.split('/').map(encodeURIComponent).join('/'))}" target="_blank" rel="noopener">${esc(f.path)}</a>` : esc(f.path);
  $('#provenance-body').innerHTML=`<p>Revision ${esc(data.revision||'unrecorded')}${data.dirty?' + local changes':''}. Spec and Bridge theorems take the assumptions listed below as explicit hypotheses; the only axioms are the opaque function symbols recorded by Aeneas. Assumptions are stated contracts, not verified library implementations.</p><p>${data.declarations.filter(d=>d.status==='assumption').map(d=>esc(d.name)).join('<br>')}</p><p>${data.coverage?`${data.coverage.checkedBridge} atoms have checked bridge theorems; ${data.coverage.bridge} have associated evidence.`:'Atom coverage is unknown until extraction.'}</p><p>${esc(bundle.lean)}${data.versions?` · Aeneas ${esc(data.versions.aeneas)} · Charon ${esc(data.versions.charon)}`:''}</p><p>${(bundle.references||[]).map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.path)}</a>`).join('<br>')}</p><table class="provenance-table">${Object.values(data.files).map(f=>`<tr><th>${esc(f.stage)}</th><td>${source(f)}<span class="hash">SHA-256 ${f.sha256}</span></td></tr>`).join('')}</table>${data.external?.length?`<h3>External boundaries</h3><ul>${data.external.map(d=>`<li>${esc(d.name)} (${esc(d.category)})</li>`).join('')}</ul>`:''}`;
  $('#provenance-dialog').showModal();
}
$('#example-picker').innerHTML='<option value="">Overview</option>'+bundle.examples.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('');
$('#example-picker').onchange=e=>{
  if(!e.target.value){location.hash='view=home';return;}
  home=false;data=Explorer.example(bundle,e.target.value);state.example=data.id;select(null);
};
$('#home').innerHTML=overview();
$('#item-picker').onchange=e=>select(e.target.value);
$('#focus-declaration').onclick=()=>{state.mode=Explorer.toggleMode(state.mode);save();render();};
for(const stage of Explorer.stages)$('#show-'+stage).onchange=e=>{Panels.set(state,stage,e.target.checked);save();render(true);};
$('#show-support').onchange=e=>{state.support=e.target.checked;for(const stage of Explorer.stages)files[stage]=Explorer.file(data,item,stage,files[stage],state.support);save();render();};
$('#font-size').onchange=e=>{state.font=Math.min(18,Math.max(10,Number(e.target.value)||12));save();render();};
$('#provenance').onclick=provenance;
$('#close-dialog').onclick=()=>$('#provenance-dialog').close();
window.addEventListener('hashchange',()=>{load();render();});
window.addEventListener('blur',()=>endDrag(false));
new ResizeObserver(resize).observe($('#panes'));
document.addEventListener('pointerdown',e=>{if(!$('#view-menu').contains(e.target))$('#view-menu').open=false;});
// Lean rendered by Verso, when the build includes it: hover types and docstrings, binding
// highlights, and the proof state after each tactic. The page is drawn first with its plain
// colouring and again when Verso's markup has been unpacked.
let versoReady = false;
function bindVerso() {
  if (!versoReady) return;
  document.querySelectorAll('.hl.lean .token, .hl.lean .has-info, .hl.lean .tactic').forEach(el => el._tippy?.destroy());
  // A tactic that spans several lines is cut into one piece per line, and only the last piece
  // carries the proof state: give the other pieces a copy.
  document.querySelectorAll('.hl.lean .tactic').forEach(el => {
    if (el.querySelector(':scope > .tactic-state')) return;
    const state = el.closest('.pane')?.querySelector(`.tactic[data-tid="${CSS.escape(el.dataset.tid || '')}"] > .tactic-state`);
    if (state) el.append(state.cloneNode(true)); else el.classList.remove('tactic');
  });
  window.versoInit();
}
async function loadVerso() {
  const packed = document.getElementById('verso-data');
  if (!packed || !window.versoInit || !window.DecompressionStream) return;
  const bytes = Uint8Array.from(atob(packed.textContent), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const verso = JSON.parse(await new Response(stream).text());
  for (const example of bundle.examples) for (const file of Object.values(example.files)) file.html = verso.files[file.path];
  window.versoDocs = Promise.resolve(verso.docs);
  versoReady = true;
  render(true);
}
load();save();render();loadVerso();
})();
