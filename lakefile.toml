name = "bridgingExamples"
version = "0.1.0"
defaultTargets = ["BridgingExamples"]

# Verso renders the Lean shown in the explorer. It comes first so that the versions of shared
# dependencies are the ones VCVio and Mathlib pin.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "01a09f320122475119588526857a07d218aef600"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "2567392aabfcf1c29a8a7958e4f750829952d83f"

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
rev = "da2b22e78d8fd5f076a902a5617c34038409fb79"
subDir = "backends/lean"

[[lean_lib]]
name = "BridgingExamples"

[[lean_lib]]
name = "Generated"
