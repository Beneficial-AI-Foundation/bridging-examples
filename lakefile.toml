name = "bridgingExamples"
version = "0.1.0"
defaultTargets = ["BridgingExamples", "Common"]

# Verso renders the Lean shown in the explorer. It comes first so that the versions of shared
# dependencies are the ones VCVio and Mathlib pin.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "01a09f320122475119588526857a07d218aef600"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "2567392aabfcf1c29a8a7958e4f750829952d83f"

# Aeneas at da2b22e with `aeneas.patch` applied (`Result` has a `random` effect), checked out by
# `scripts/aeneas.sh`.
[[require]]
name = "aeneas"
path = "aeneas/backends/lean"

# One folder per example: the generated Aeneas.lean and the handwritten Spec, Crypto and Bridge,
# with one subfolder per bridge when the example has several.
[[lean_lib]]
name = "BridgingExamples"
globs = ["BridgingExamples.+"]

# Lean shared by the examples: proof lemmas and the explorer's metadata commands.
[[lean_lib]]
name = "Common"
globs = ["Common.+"]
